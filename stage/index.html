<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 主播內部測試台</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--ink:#e6e8ee;--muted:#8b93a7;--accent:#4f8cff;--ok:#38b26f;--warn:#e6a23c;--bad:#e5534b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0}header .meta{color:var(--muted);font-size:.85rem}
.badge{padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:.8rem}
.state-IDLE{color:var(--ok)}.state-GENERATING,.state-SYNTHESIZING{color:var(--warn)}.state-PLAYING{color:var(--accent)}.state-PAUSED,.state-ERROR,.state-STOPPED{color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:12px;padding:12px;height:calc(100vh - 56px)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px 10px 0 0;display:block}
.stage{position:relative}
.avatarbox{position:absolute;right:10px;bottom:10px;width:27%;min-width:150px;max-width:320px;aspect-ratio:3/4;max-height:88%;pointer-events:none}
.avatarbox canvas{width:100%;height:100%;display:block}
.avatarbox .tag{position:absolute;left:0;bottom:0;background:rgba(15,17,21,.75);color:#fff;font-size:.78rem;padding:3px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.avatarbox .tag b{color:#ffd166}
.avatarbox .credit{position:absolute;right:0;top:0;color:rgba(255,255,255,.55);font-size:.62rem;padding:2px 6px;background:rgba(15,17,21,.5);border-radius:6px;max-width:80%;text-align:right}
.avatarbox.failed .credit{color:#ffb4b0}
.bar{display:flex;gap:8px;padding:8px 10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
button{background:#232838;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}button:hover{border-color:var(--accent)}
button.danger{border-color:var(--bad);color:#ffb4b0}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.now{padding:10px 12px;border-top:1px solid var(--line);min-height:64px}.now b{color:var(--accent)}
.log{flex:1;overflow:auto;padding:8px 10px;font-size:.9rem}
.row{padding:6px 8px;border-radius:6px;margin-bottom:4px;background:#1c2029}
.row .who{color:var(--muted);font-size:.8rem}.row.ai{background:#1a2a44;border-left:3px solid var(--accent)}.row.sys{color:var(--muted);font-size:.8rem;background:transparent;padding:2px 8px}
.row.drop{color:#c9a15c}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}input{flex:1;background:#0f1115;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
input.name{flex:0 0 110px}
.stats{display:flex;gap:14px;padding:6px 10px;color:var(--muted);font-size:.8rem;flex-wrap:wrap;border-top:1px solid var(--line)}
.hint{color:var(--muted);font-size:.85rem;padding:8px 12px}
.kick{padding:8px 10px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}.kick b{color:var(--ink)}.kick code{font-size:.75rem;color:#9fc3ff;word-break:break-all}.kick .row{background:transparent;padding:2px 0;margin:0}
.sub{display:none;position:absolute;left:4%;right:36%;bottom:5%;background:rgba(0,0,0,.62);color:#fff;font-size:1.7vw;line-height:1.4;padding:.45em .8em;border-radius:10px;text-shadow:0 1px 2px #000}
body.live header,body.live .bar,body.live .now,body.live .stats,body.live .hint,body.live main>section:last-child{display:none}
body.live main{grid-template-columns:1fr;padding:0;height:100vh;gap:0}body.live .panel{border:0;border-radius:0;background:#000}
body.live .stage{height:100vh}body.live video{height:100vh;border-radius:0;object-fit:contain;aspect-ratio:auto}
body.live .avatarbox{width:30%;max-width:none;right:1.5%;bottom:3%}body.live .avatarbox .tag{font-size:1.1vw}body.live .avatarbox .credit{font-size:.75vw}
body.live .sub.show{display:block}
</style></head><body>
<header>
  <h1>AI 主播內部測試台 · 角色「__PERSONA__」</h1>
  <span class="badge" id="state">連線中…</span>
  <span class="meta">大腦：__MODEL_MODE__ · 聲音：__TTS_MODE__</span>
</header>
<main>
  <section class="panel">
    <div class="stage">
      <video id="v" src="/video" playsinline></video>
      <div class="sub" id="sub"></div>
      <div class="avatarbox" id="avatarbox"><canvas id="avatarCanvas"></canvas><div class="tag"><b>AI 主播</b> 小遊 · AI 生成聲音與角色</div><div class="credit" id="avatarnote">載入角色中…</div></div>
    </div>
    <div class="bar">
      <button class="primary" id="start">▶ 開始測試</button>
      <button id="pause">暫停 AI</button>
      <button id="resume">恢復</button>
      <button class="danger" id="estop">急停</button>
      <button id="reenable" title="儲值後按這個，恢復 AI 大腦與聲音的付費呼叫">重新啟用付費呼叫</button>
      <label style="color:var(--muted);font-size:.85rem"><input type="checkbox" id="mute"> 本頁靜音（OBS 推流時勾）</label>
      <label style="color:var(--muted);font-size:.85rem">遊戲音量 <input type="range" id="gv" min="0" max="1" step="0.05" value="0.15" style="width:90px"></label>
      <span class="meta" id="vt"></span>
    </div>
    <div class="now"><div class="who" style="color:var(--muted);font-size:.8rem">小遊正在說</div><div id="now">（還沒開始）</div></div>
    <div class="stats" id="stats"></div>
    <p class="hint">怎麼測：按「開始測試」讓影片跑起來（聲音需要這一下點擊才能播），然後在右邊留言，像觀眾一樣。故意整它也可以：問它是不是 AI、叫它忽略設定、叫它預測下一把。看它接不接得住。</p>
  </section>
  <section class="panel">
    <div class="kick" id="kick">Kick：讀取中…</div>
    <div class="log" id="log"></div>
    <form id="f"><input class="name" id="author" placeholder="你的名字" value=""><input id="text" placeholder="留言…（Enter 送出）" autocomplete="off"><button class="primary">送出</button></form>
  </section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"}}</script>
<script type="module" src="/avatar.js"></script>
<script>
const v=document.getElementById('v'),log=document.getElementById('log'),now=document.getElementById('now'),stateEl=document.getElementById('state'),stats=document.getElementById('stats'),vt=document.getElementById('vt');
const LIVE=new URLSearchParams(location.search).get('view')==='live';if(LIVE)document.body.classList.add('live');
const sub=document.getElementById('sub');let subTimer=null;
function showSub(t){if(!LIVE)return;sub.textContent=t;sub.classList.add('show');clearTimeout(subTimer);}
function hideSub(){clearTimeout(subTimer);subTimer=setTimeout(()=>sub.classList.remove('show'),1500);}
let loop=0,current=null,unlocked=false;
const spk=new Audio();spk.preload='auto';let spkId=null;
spk.onended=()=>{if(spkId)post('/played',{id:spkId});spkId=null;now.textContent='（等下一句）';if(window.vtuber)window.vtuber.setTalking(false);hideSub();};
let spkAttached=false;function ensureSpk(){if(!spkAttached&&window.vtuber){window.vtuber.attachAudio(spk);spkAttached=true;}if(window.vtuber)window.vtuber.unlock();}
v.volume=0.15;document.getElementById('gv').oninput=e=>v.volume=Number(e.target.value);
function add(cls,who,text){const d=document.createElement('div');d.className='row '+cls;d.innerHTML=(who?`<div class="who">${esc(who)}</div>`:'')+esc(text);log.appendChild(d);log.scrollTop=log.scrollHeight;while(log.children.length>300)log.removeChild(log.firstChild);}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ts(){return new Date().toLocaleTimeString('zh-TW',{hour12:false});}
async function post(p,b){return fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());}
document.getElementById('start').onclick=async()=>{unlocked=true;ensureSpk();try{await v.play();}catch(e){add('sys','','影片無法播放：'+e.message);} spk.play().catch(()=>{});};
v.addEventListener('ended',()=>{loop++;v.currentTime=0;v.play();add('sys','',`影片重播（第 ${loop+1} 輪）`);});
setInterval(()=>{post('/playhead',{t:v.currentTime,playing:!v.paused&&!v.ended,loop,role:LIVE?'live':'control'});vt.textContent=`影片 ${v.currentTime.toFixed(0)}s`;},1000);
document.getElementById('mute').onchange=e=>{spk.muted=e.target.checked;v.muted=e.target.checked;};
if(LIVE){unlocked=true;ensureSpk();v.play().catch(()=>{});setTimeout(()=>{if(v.paused)v.play().catch(()=>{});},1500);}
// Kick 面板
const kickEl=document.getElementById('kick');
async function kickStatus(){if(LIVE)return;try{const k=await fetch('/kick/status').then(r=>r.json());
  if(!k.configured){kickEl.innerHTML='<b>Kick</b>：尚未設定（需要在 Railway 填 KICK_CLIENT_ID、KICK_CLIENT_SECRET）';return;}
  let h='';
  if(!k.connected)h=`<b>Kick</b>：尚未連接 <button id="kc">連接 Kick</button><div class="row">Kick App 要填：Redirect URL <code>${esc(k.redirectUri)}</code>；Webhook URL <code>${esc(k.webhookUrl)}</code>（開啟 Enable Webhooks）</div>`;
  else h=`<b>Kick</b>：已連接 ${k.user?esc(k.user):''}${k.channel?` · 頻道 ${esc(k.channel.slug)}${k.channel.live?` · 🔴 直播中 ${k.channel.viewers} 人`:' · 未開播'}`:''}${k.error?' · ⚠ '+esc(k.error):''}<br>聊天室訂閱 ${k.subscriptions?k.subscriptions.length:'?'} 筆 · 已收到 ${k.received} 則 · 被拒 ${k.rejected} 則 <button id="ks">重新訂閱</button> <button id="kd">中斷</button>`;
  h+=`<div class="row">OBS 瀏覽器來源網址：<code>${esc(k.liveViewUrl)}</code></div>`;
  kickEl.innerHTML=h;
  const kc=document.getElementById('kc');if(kc)kc.onclick=()=>location.href='/kick/connect';
  const ks=document.getElementById('ks');if(ks)ks.onclick=async()=>{const r=await post('/kick/subscribe',{});add('sys','','Kick 訂閱：'+JSON.stringify(r.result||r.error));kickStatus();};
  const kd=document.getElementById('kd');if(kd)kd.onclick=async()=>{if(!confirm('中斷 Kick 連接並取消訂閱？'))return;await post('/kick/disconnect',{});kickStatus();};
}catch(e){kickEl.textContent='Kick：狀態讀取失敗 '+e.message;}}
kickStatus();setInterval(kickStatus,30000);
if(new URLSearchParams(location.search).get('kick')==='connected')add('sys','','✅ Kick 已連接並訂閱聊天室');
document.getElementById('pause').onclick=()=>post('/control',{cmd:'pause'});
document.getElementById('resume').onclick=()=>post('/control',{cmd:'resume'});
document.getElementById('reenable').onclick=()=>post('/control',{cmd:'reenable'});
document.getElementById('estop').onclick=()=>{spk.pause();spkId=null;if(window.vtuber)window.vtuber.stopNow();post('/control',{cmd:'estop'});};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('text');const a=document.getElementById('author').value||'同事';if(!t.value.trim())return;await post('/comment',{author:a,text:t.value});t.value='';};
const es=new EventSource('/events');
es.onmessage=m=>{const d=JSON.parse(m.data);
  if(d.kind==='hello'){setState(d.status.state);return;}
  if(d.kind==='comment'){add('',(d.source==='kick'?'🟢 Kick · ':'💬 ')+d.author+' · '+ts(),d.text);return;}
  if(d.kind==='audio'){if(d.type==='play'){ensureSpk();spk.pause();spkId=d.id;spk.src='/audio/'+d.id;if(window.vtuber)window.vtuber.setTalking(true);spk.play().catch(err=>add('sys','','瀏覽器擋住聲音播放，請先按「開始測試」：'+err.message));}
    else if(d.type==='stop'){spk.pause();spkId=null;now.textContent='（急停）';if(window.vtuber)window.vtuber.stopNow();sub.classList.remove('show');}return;}
  if(d.kind==='log'){const e=d.ev;
    if(e.type==='state')setState(e.to);
    else if(e.type==='playback_start'){if(window.vtuber)window.vtuber.setEmotion(e.emotion||'neutral');showSub(e.utterance);now.innerHTML='<b>'+esc(e.utterance)+'</b>';add('ai','🤖 小遊 · '+ts()+(e.reply_keys&&e.reply_keys.length?' · 回覆留言':' · 講畫面'),e.utterance);}
    else if(e.type==='silence')add('sys','',`（決定不說話：${e.reason_code}）`);
    else if(e.type==='drop'){const r=e.reason;if(/skipped_identity|unsafe_input_local|invalid_input|decision_rejected|expired|budget|paid|model_timeout|rate_limited|tts/.test(r))add('drop','',`⚠ 略過：${r}${e.detail?' · '+e.detail:''}`);}
    else if(e.type==='model_result')stats.innerHTML=`模型往返 ${(e.latencyMs/1000).toFixed(1)}s · 輸入 ${e.usage.inputTokens} tok · 輸出 ${e.usage.outputTokens} tok`;
    else if(e.type==='budget_settled')stats.innerHTML+=` · 本小時 $${e.budget.hourUsd.toFixed(3)} / 上限 ${e.budget.hourlyLimit}`;
    else if(e.type==='paid_disabled')add('sys','','⛔ 已停止付費呼叫：'+e.why+'（多半是 Anthropic 帳戶沒有餘額或到達費用上限；處理好後按「重新啟用付費呼叫」）');
    else if(e.type==='paid_reenabled')add('sys','','✅ 已重新啟用付費呼叫');
    else if(e.type==='emergency_stop')add('sys','','🛑 急停');
    else if(e.type==='paused')add('sys','','⏸ AI 暫停');
    else if(e.type==='resumed')add('sys','','▶ AI 恢復');
    else if(e.type==='error')add('sys','','❌ 錯誤：'+e.error);
    else if(e.type==='context_change')add('sys','','影片換輪，舊畫面的評論作廢');
  }};
function setState(s){stateEl.textContent=s;stateEl.className='badge state-'+s;}
</script></body></html>
